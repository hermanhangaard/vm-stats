<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vmusr dndcp debug</title>
<style>
body { background: #fff; color: #000; margin: 0; }
pre { font-family: "Lucida Console", "DejaVu Sans Mono", Consolas, monospace; font-size: 13px; line-height: 1.35; margin: 8px; white-space: pre; }
</style>
</head>
<body>
<pre>sudo tee /etc/vmware-tools/tools.conf &gt;/dev/null &lt;&lt;'EOF'
[logging]
log = true
vmusr.level = debug
vmusr.handler = file
vmusr.data = /tmp/vmusr.log
EOF

pkill -f "vmtoolsd -n vmusr"
DISPLAY=:0 /usr/bin/vmtoolsd -n vmusr &amp;
sleep 3
grep -iE "dndcp|copypaste|error|fail" /tmp/vmusr.log | head -30</pre>
</body>
</html>
